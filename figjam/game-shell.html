<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scale Miniatures race</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; background: #111014; color: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; }
    button, input, select { font: inherit; }
    button { cursor: pointer; border: 0; padding: 9px 14px; background: #ffe800; color: #111014; font-weight: 700; }
    button:disabled { opacity: .5; cursor: default; }
    input, select { padding: 8px; }
    .panel { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 12px 0; }
    #roomline, #needfiles, #board { border: 2px solid #29abe2; padding: 14px; margin: 14px 0; }
    #players { margin: 10px 0; padding-left: 22px; }
    #players li { margin: 3px 0; }
    #countdown { font-size: 56px; font-weight: bold; color: #ffe800; text-align: center; }
    #code { color: #ffe800; font-size: 24px; font-weight: bold; margin: 0; }
    #list { margin: 8px 0; }
    #stage { width: 100%; text-align: center; background: #000; }
    #stage canvas { display: block; width: min(100%, 960px); height: auto; margin: auto; image-rendering: pixelated; }
    #overlay { position: absolute; top: 10px; left: 10px; background: #111b; color: #ffe800; }
    #stage { position: relative; }
    #status { color: #ffe800; min-height: 2em; }
    #board { color: #111014; background: #f4f1e4; }
    #board li.you { font-weight: bold; }
    #head, #share, #feedbackform { display: none; }
    [hidden] { display: none !important; }
  </style>
  <script>globalThis.__SM_FIGJAM_WAIT__ = true;</script>
</head>
<body>
  <div id="head"><canvas id="hero-canvas"></canvas></div>
  <main>
    <div id="lobby">
      <h1>Scale Miniatures</h1>
      <div id="choices" class="panel" hidden>
        <button id="create" type="button">Make a room</button>
        <form id="joinform"><input id="joincode" maxlength="4"><button type="submit">Join</button></form>
      </div>
      <div id="roomline" hidden>
        <p id="code"></p><a id="share" href="#"></a><p id="who"></p>
        <ol id="players"></ol>
        <p id="countdown" hidden></p>
        <div id="setup" hidden>
          <div class="panel"><label>Race <select id="kind"><option value="race">A race</option><option value="h2h">Head to head</option></select></label>
          <label>Laps <input id="laps" type="number" min="3" max="40" value="3"></label>
          <label>Cars <select id="cars"><option value="4">4</option><option value="2">2</option><option value="3">3</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option></select></label></div>
          <div class="panel"><label>Track <select id="track"></select></label><button id="add" type="button">Add to playlist</button></div>
          <ol id="list"></ol>
        </div>
        <button id="start" type="button" hidden disabled>Start the race</button>
      </div>
      <div id="needfiles" hidden>
        <p>Select your installed Micro Machines folder. Files stay on your device.</p>
        <button id="pickfolder" type="button">Choose game folder</button>
        <input id="folder" type="file" webkitdirectory multiple hidden>
        <span id="why"></span>
      </div>
    </div>
    <div id="stage" hidden><canvas id="screen" width="320" height="200"></canvas><p id="overlay" hidden></p></div>
    <div id="under" hidden><button id="fullscreen" type="button">Full screen</button></div>
    <div id="board" hidden></div>
    <p id="status" role="status">Opening race…</p>
    <form id="feedbackform"><textarea id="feedback"></textarea><span id="thanks"></span></form>
  </main>
  <!-- GAME_SCRIPT -->
</body>
</html>
