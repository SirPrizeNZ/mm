    const publishSettings = () => {
      if (!host || agreed) return;
      settings = {
        track: Number(trackSelect.value),
        laps: Math.max(1, Math.min(10, Math.round(Number(lapsInput.value) || 3)))
      };
      lapsInput.value = String(settings.laps);
      mapPreview(settings.track);
      wire.send(encodeSay({ settings }));
      showRoom();
    };
    trackSelect.addEventListener("change", publishSettings);
    lapsInput.addEventListener("change", publishSettings);
    showRoom();
    wire.send(encodeSay({ profile: name, request: true }));
    const finish = () => {
      if (!agreed || ended) return;
      ended = true;
      const order = standings(state);
      const points = Array.from({ length: agreed.humans }, (_, i) => agreed.humans - order.indexOf(i));
      board.replaceChildren();
      const title = document.createElement("h2");
      title.textContent = "Race results";
      board.append(title);
      const list = document.createElement("ol");
      for (const slot of order) {
        const li = document.createElement("li");
        li.textContent = `${agreed.names[slot] ?? "Guest"} \u2014 ${points[slot]} points`;
        if (slot === mine) li.className = "you";
        list.append(li);
      }
      board.append(list);
      stage.hidden = true;
      board.hidden = false;
      countdown.hidden = true;
      status.textContent = "Race complete. Start a new race from the FigJam board.";
      wire.publishResult(0, points, agreed.names);
      parent.postMessage({ pluginMessage: {
        type: "result",
        session: launch.session,
        result: { gen: 0, points, names: agreed.names, at: Date.now() }
      } }, "*");
    };
    const begin = () => {
      if (!agreed || ended || !startAt) return;
      const left = Math.ceil((startAt - Date.now()) / 1e3);
      if (left > 0) {
        countdown.textContent = String(left);
        countdown.hidden = false;
        status.textContent = `Race starts in ${left}\u2026`;
        return;
      }
      countdown.hidden = true;
      lobby.hidden = true;
      stage.hidden = false;
      status.textContent = "Arrow keys to drive";
      const target = Math.min(30 * 60 * 5, Math.floor((Date.now() - startAt) / TICK_MS));
      const horizon = Math.min(target + 4, 30 * 60 * 5);
      while (sent < horizon) {
        sent++;
        inputs[mine][sent] = keys;
        if (sent % 2 === 0 || sent === horizon) {
          const from = Math.max(0, sent - 7);
          wire.send(encodeInput(0, from, inputs[mine].slice(from, sent + 1)));
        }
      }
      let catchup = 0;
      while (state.step <= target && catchup++ < 120) {
        const stepInputs = inputs.slice(0, agreed.humans).map((log) => log[state.step]);
        if (stepInputs.some((x) => x === void 0)) break;
        advance(state, stepInputs, agreed.track, agreed.laps);
        if (state.step % 60 === 0) wire.send(encodeHash(0, state.step, stateHash(state)));
        const firstFinish = Math.min(...state.cars.map((c) => c.finished || Infinity));
        if (state.cars.every((c) => c.finished) || state.step >= 30 * 60 * 5 || Number.isFinite(firstFinish) && state.step - firstFinish >= 30 * 30) {
          finish();
          return;
        }
      }
      drawTrack(ctx, agreed.track);
      drawCars(ctx, state, agreed.names, mine);
      frames++;
      const now = performance.now();
      if (now - fpsAt > 1e3) {
        fps = Math.round(frames * 1e3 / (now - fpsAt));
        fpsAt = now;
        frames = 0;
      }
      lastFrame = now;
      overlay.hidden = false;
      overlay.textContent = `${agreed.names[mine]} \xB7 lap ${Math.min(agreed.laps, state.cars[mine].laps + 1)}/${agreed.laps} \xB7 ${fps} FPS`;
    };
    void lastFrame;
    wire.onJoin = () => {
      wire.send(encodeSay({ profile: name }));
      showRoom();
    };
    wire.onLeave = (slot) => {
      names.delete(slot);
      ready.delete(slot);
      showRoom();
      if (agreed && !ended) {
        ended = true;
        stage.hidden = true;
        lobby.hidden = false;
        status.textContent = "A driver disconnected. Start a new race from the FigJam board.";
      }
    };
    wire.onError = (why) => {
      status.textContent = why;
    };
    wire.onPacket = (from, data) => {
      const packet = decodePacket(data);
      if (!packet) return;
      if (packet.kind === INPUT && agreed && from < agreed.humans && packet.gen === 0) {
        for (let i = 0; i < packet.bytes.length; i++) inputs[from][packet.from + i] = packet.bytes[i];
        return;
      }
      if (packet.kind === HASH && packet.gen === 0 && packet.step === state.step && agreed && packet.hash !== stateHash(state)) {
        ended = true;
        stage.hidden = true;
        lobby.hidden = false;
        status.textContent = "Race states differed. Start a new race.";
        return;
      }
      if (packet.kind !== SAY) return;
      let body;
      try {
        body = JSON.parse(packet.text);
      } catch {
        return;
      }
      if (typeof body.profile === "string") {
        names.set(from, body.profile.trim().slice(0, 40) || "Guest");
        showRoom();
        if (body.request) {
          wire.send(encodeSay({ profile: name }));
          if (host) wire.send(encodeSay({ settings, underway: !!agreed }));
        }
      }
      if (!host && from === 0 && body.settings && !agreed) {
        if (Number.isInteger(body.settings.track) && body.settings.track >= 0 && body.settings.track < TRACKS.length && Number.isInteger(body.settings.laps)) {
          settings = { track: body.settings.track, laps: Math.max(1, Math.min(10, body.settings.laps)) };
          mapPreview(settings.track);
          showRoom();
        }
      }
      if (body.underway && !agreed) {
        start.disabled = true;
        status.textContent = "This race already started. Join the next race from the FigJam board.";
      }
      if (body.go && from === 0 && !agreed) {
        const go = body.go;
        if (go.humans < 2 || go.humans > 10 || go.names.length !== go.humans || go.track < 0 || go.track >= TRACKS.length || go.laps < 1 || go.laps > 10) return;
        agreed = go;
        state.cars = initialState(go.humans, go.track).cars;
        ready.add(mine);
        wire.send(encodeSay({ ready: true }));
        showRoom();
      }
      if (host && body.ready && agreed) {
        ready.add(from);
        if (ready.size === agreed.humans && !startAt) {
          startAt = Date.now() + 5e3;
          wire.send(encodeSay({ startAt }));
        }
      }
      if (body.startAt && from === 0 && agreed && !startAt) startAt = body.startAt;
    };
    start.addEventListener("click", () => {
      if (!host || start.disabled || agreed) return;
      const slots = [mine, ...wire.peers].sort((a, b) => a - b);
      agreed = {
        ...settings,
        humans: slots.length,
        names: slots.map((slot) => names.get(slot) ?? "Guest")
      };
      state.cars = initialState(agreed.humans, agreed.track).cars;
      ready.add(mine);
      start.disabled = true;
      wire.send(encodeSay({ go: agreed }));
      showRoom();
    });
    $("#fullscreen").addEventListener("click", () => {
      void stage.requestFullscreen?.().catch(() => {
      });
    });
    addEventListener("figjam-close", () => wire.close(), { once: true });
    addEventListener("pagehide", () => wire.close(), { once: true });
    const timer = setInterval(() => {
      if (ended || !wire.open) {
        clearInterval(timer);
        return;
      }
      begin();
    }, TICK_MS);
  }

  // figjam/game-entry.ts
  var started = false;
  var status2 = document.querySelector("#status");
  var showError = (why) => {
    if (status2) status2.textContent = why;
  };
  addEventListener("error", (event) => showError(`Race failed to open: ${event.message}`));
  addEventListener("unhandledrejection", (event) => showError(`Race failed to open: ${String(event.reason)}`));
  addEventListener("message", (event) => {
    const message = event.data?.pluginMessage;
    if (message?.type === "disconnect") {
      dispatchEvent(new Event("figjam-close"));
      return;
    }
    if (started) return;
    if (message?.type !== "start" || !/^[A-Z2-9]{20}$/.test(message.session ?? "") || !/^wss?:\/\/[^/]+\/api\/relay$/.test(message.relayUrl ?? "")) return;
    started = true;
    clearInterval(readyTimer);
    globalThis.__SM_FIGJAM__ = {
      session: message.session,
      relayUrl: message.relayUrl,
      name: message.name?.trim().slice(0, 40) || "Guest",
      track: message.track,
      laps: message.laps
    };
    void startMiniGrid(globalThis.__SM_FIGJAM__).catch((e) => showError(`Race failed to open: ${String(e)}`));
  });
  var announceReady = () => parent.postMessage({ pluginMessage: { type: "ready" } }, "*");
  var readyTimer = setInterval(announceReady, 1e3);
  announceReady();
  setTimeout(() => {
    if (!started) showError("Waiting for the FigJam widget to connect. Close this window and try Join race again.");
  }, 5e3);
})();
</script>
</body>
</html>
